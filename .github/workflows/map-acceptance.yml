name: Final native map acceptance
on:
  push:
    branches: [feature/real-world-scenarios]
    paths: [.github/workflows/map-acceptance.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  native-map:
    if: github.ref == 'refs/heads/feature/real-world-scenarios'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Add readable attribution backdrop and explicit ignored provider test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/osb-client/src/main.rs')
          s = p.read_text()
          assert s.count('mod geographic;') == 1
          p.write_text(s.replace('mod geographic;', 'mod geographic;\n#[cfg(test)]\nmod live_acceptance;'))
          p = Path('apps/osb-client/src/browser.rs')
          s = p.read_text()
          anchor = '''        painter.text(
                      rect.left_top() + egui::vec2(14.0, 14.0),'''
          overlay = '''        // Attribution and status stay readable on both light and dark styles.
                  let backdrop = egui::Color32::from_rgba_unmultiplied(20, 28, 32, 240);
                  painter.rect_filled(
                      egui::Rect::from_min_max(
                          rect.left_top() + egui::vec2(8.0, 8.0),
                          rect.right_top() + egui::vec2(-8.0, 58.0),
                      ),
                      3.0,
                      backdrop,
                  );
                  painter.rect_filled(
                      egui::Rect::from_min_max(
                          rect.left_bottom() + egui::vec2(8.0, -37.0),
                          rect.right_bottom() + egui::vec2(-8.0, -8.0),
                      ),
                      3.0,
                      backdrop,
                  );
          '''
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, overlay + anchor))
          PY
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Commit only the formatted application source to the feature branch
        run: |
          cargo fmt --all
          git fetch origin feature/real-world-scenarios
          test "$(git rev-parse origin/feature/real-world-scenarios)" = "$GITHUB_SHA"
          git add apps/osb-client/src
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: maintain map attribution contrast and add opt-in geographic acceptance test'
          git push origin HEAD:feature/real-world-scenarios
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-revision.txt
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan-dev libclang-dev mesa-vulkan-drivers weston
      - name: Install pinned MapLibre prefix
        run: |
          prefix=$(bash tools/setup-maplibre.sh)
          echo "MAPLIBRE_NATIVE_C_INSTALL_DIR=$prefix" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Compile and lint final source
        run: |
          cargo build --locked -p osb-client --features live-map
          cargo test --locked -p osb-client --features live-map 2>&1 | tee artifacts/tests.log
          cargo clippy --locked -p osb-client --features live-map --all-targets -- -D warnings
          cargo fmt --all -- --check
      - name: Explicit single small OSM acquisition and checkpoint acceptance
        env:
          OSB_LIVE_TEST_ENDPOINT: https://overpass-api.de/api/interpreter
          OSB_LIVE_TEST_OUTPUT: artifacts/geodata
        run: timeout 120s cargo test --locked -p osb-client --features live-map live_geography_roundtrip -- --ignored --nocapture 2>&1 | tee artifacts/acquisition.log
      - name: Render the acquired real geometry and individual observer
        run: |
          OSB_SMOKE_FRAMES=120 bash tools/wayland_smoke.sh artifacts/geodata/scenario.json
          mv artifacts/client.png artifacts/real-battle.png
          mv artifacts/client.log artifacts/real-battle.log
      - name: Live native map screenshot with readable attribution
        run: |
          OSB_SMOKE_FRAMES=300 bash tools/wayland_smoke.sh --world-smoke --live-smoke
          mv artifacts/client.png artifacts/world-live.png
          mv artifacts/client.log artifacts/world-live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-map-acceptance
          path: artifacts/
