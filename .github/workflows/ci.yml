name: Rust CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked --workspace --exclude osb-client
      - run: python3 tools/check_boundaries.py
      - name: Headless combat smoke and checkpoint
        run: |
          mkdir -p artifacts
          cargo run --locked -p osb-headless -- --duration 8m --save artifacts/smoke.osb --events artifacts/events.jsonl > artifacts/headless.json
          cargo run --locked -p osb-headless -- --load artifacts/smoke.osb --duration 10s > artifacts/resumed.json
          test -s artifacts/events.jsonl
      - run: cargo clippy --locked --workspace --exclude osb-client --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-validation
          path: artifacts/
  wayland-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Native Wayland and software Vulkan test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers weston
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --locked -p osb-client
      - name: Reject accidental X11 feature unification
        run: |
          if cargo tree --locked -p osb-client -e features | grep -E 'winit feature "x11"|bevy feature "x11"'; then
            echo 'X11 feature unexpectedly enabled'; exit 1
          fi
      - name: Launch actual Wayland/Vulkan client under a headless compositor
        run: bash tools/wayland_smoke.sh
      - run: cargo clippy --locked -p osb-client --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayland-vulkan-validation
          path: artifacts/
