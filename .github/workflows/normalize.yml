name: Manual source normalization
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-normalization
  cancel-in-progress: false
jobs:
  normalize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Generate lockfile and apply Rust's machine-applicable formatting/lint suggestions
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo clippy --fix --allow-dirty --workspace --all-targets
          cargo fmt --all
      - name: Commit only the lockfile and tracked Rust source, without overwriting concurrent work
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add Cargo.lock
          git ls-files -z '*.rs' | xargs -0 git add --
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: lock dependencies and normalize Rust source'
            git push origin HEAD:main
          fi
