[package]
name = "osb-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
  "bevy_render", "bevy_core_pipeline", "bevy_winit", "bevy_window",
  "bevy_camera", "bevy_color", "bevy_image", "bevy_mesh", "bevy_shader",
  "mouse", "keyboard", "wayland", "png"
] }
# Upstream v0.42.0 source with a manifest-only Wayland patch.
# See vendor/bevy_egui/OSB_PATCH.md and docs/DEPENDENCY_NOTES.md.
bevy_egui = { path = "../../vendor/bevy_egui", default-features = false, features = ["render", "default_fonts"] }
osb-sim.workspace = true
osb-world.workspace = true
osb-map.workspace = true
osb-planner.workspace = true
osb-campaign.workspace = true
serde_json.workspace = true
clap.workspace = true

[lints]
workspace = true
