[package]
name = "osb-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
  "bevy_render", "bevy_core_pipeline", "bevy_winit", "bevy_window",
  "bevy_camera", "bevy_color", "bevy_image", "bevy_mesh", "bevy_shader",
  "mouse", "keyboard", "wayland", "png"
] }
# Exact upstream v0.42.0 source revision. The registry package failed against
# Bevy 0.19.1 with a nonexistent PipelineCacheError::ImmediateSize match arm.
bevy_egui = { git = "https://github.com/vladbat00/bevy_egui", rev = "cfc6f33d47ab21210abe42d3f7c3850c9162de82", default-features = false, features = ["render", "default_fonts"] }
osb-sim.workspace = true
osb-world.workspace = true
osb-map.workspace = true
osb-planner.workspace = true
osb-campaign.workspace = true
serde_json.workspace = true
clap.workspace = true

[lints]
workspace = true
